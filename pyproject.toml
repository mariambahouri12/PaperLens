[project]
name = "paperlens"
version = "0.1.0"
description = "RAG over research papers with hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "ollama>=0.3",
    "google-genai>=0.3",
    "pillow>=10.0",
    "pandas>=2.0",
    "psutil>=5.9",
    "tiktoken>=0.7",
    "mineru>=1.0",
    "streamlit>=1.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]